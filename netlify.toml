[functions]
  directory = "netlify/functions"
  external_node_modules = ["sharp"]

[build]
  command = "cd phase0 && npm install && npm run build"
  publish = "phase0/dist"

[[redirects]]
  from = "/api/plan-handoff"
  to = "/.netlify/functions/plan-handoff"
  status = 200

[[redirects]]
  from = "/api/plan-posts"
  to = "/.netlify/functions/plan-posts"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
