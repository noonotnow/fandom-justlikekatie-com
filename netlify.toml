[functions]
  directory = "netlify/functions"
  external_node_modules = ["sharp", "stripe", "stripe-replit-sync", "pg"]

[build]
  # Netlify reads package.json#packageManager and installs that exact pnpm version
  # before this command. `netlify build --offline` verifies this command locally;
  # the hosted deploy log must report pnpm 10.26.1 during dependency installation.
  command = "pnpm run build"
  publish = "dist"

[[edge_functions]]
  function = "seo-indexing"
  path = "/vibe-atlas"

[[edge_functions]]
  function = "seo-indexing"
  path = "/vibe-atlas/*"

[[edge_functions]]
  function = "seo-indexing"
  path = "/auth/*"

[[edge_functions]]
  function = "seo-indexing"
  path = "/memeforge/middle-earth"

[[edge_functions]]
  function = "seo-indexing"
  path = "/memeforge/middle-earth/*"

