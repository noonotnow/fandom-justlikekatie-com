[functions]
  directory = "netlify/functions"
  external_node_modules = ["sharp"]

[build]
  command = "npm install && npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/card-metrics"
  to = "/.netlify/functions/card-metrics"
  status = 200

[[redirects]]
  from = "/api/plan-handoff"
  to = "/.netlify/functions/plan-handoff"
  status = 200

[[redirects]]
  from = "/api/plan-posts"
  to = "/.netlify/functions/plan-posts"
  status = 200

[[redirects]]
  from = "/api/plan-operator-scheduled"
  to = "/.netlify/functions/plan-operator-scheduled"
  status = 200

[[redirects]]
  from = "/api/idea-packets"
  to = "/.netlify/functions/idea-packets"
  status = 200

[[redirects]]
  from = "/api/create-handoff"
  to = "/.netlify/functions/create-handoff"
  status = 200

[[redirects]]
  from = "/api/internal/idea-packet-migration"
  to = "/.netlify/functions/idea-packet-migration"
  status = 200

[[redirects]]
  from = "/api/auth/magic-link"
  to = "/.netlify/functions/auth-magic-link"
  status = 200

[[redirects]]
  from = "/api/auth/verify"
  to = "/.netlify/functions/auth-verify"
  status = 200

[[redirects]]
  from = "/api/auth/session"
  to = "/.netlify/functions/auth-session"
  status = 200

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200

[[redirects]]
  from = "/api/collection/sync"
  to = "/.netlify/functions/collection-sync"
  status = 200

[[redirects]]
  from = "/api/create/collection"
  to = "/.netlify/functions/create-collection"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
