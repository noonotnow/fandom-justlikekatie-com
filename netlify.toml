[functions]
  directory = "netlify/functions"
  external_node_modules = ["sharp"]

[build]
  command = "npm install && npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/plan-handoff"
  to = "/.netlify/functions/plan-handoff"
  status = 200

[[redirects]]
  from = "/api/plan-posts"
  to = "/.netlify/functions/plan-posts"
  status = 200

[[redirects]]
  from = "/api/plan-operator-scheduled"
  to = "/.netlify/functions/plan-operator-scheduled"
  status = 200

[[redirects]]
  from = "/api/idea-packets"
  to = "/.netlify/functions/idea-packets"
  status = 200

[[redirects]]
  from = "/api/create-handoff"
  to = "/.netlify/functions/create-handoff"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
