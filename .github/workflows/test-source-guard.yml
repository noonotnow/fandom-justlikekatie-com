name: Test–Source Guard

# Catches the "split-brain" failure mode: a test file is pushed while its
# implementation stays local.  Every relative import in every *.test.ts /
# *.test.js file must resolve to a file that exists in the repository.
# If any import target is missing, this job fails with the list of gaps,
# giving a clear signal before the whole test suite turns red.
#
# Covered import forms:
#   import './side-effect'           (side-effect / no `from`)
#   import Foo from './module'       (named static import)
#   export { x } from './re-export'  (re-export)
#   import('./dynamic')              (dynamic import)
#
# A bare directory path is rejected unless it contains a recognised index file.
# Test files are discovered recursively under: tests/, netlify/functions/lib/,
# scripts/

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── 1. Real guard: checks all test roots ──────────────────────────────────
  check-test-imports:
    name: Verify test imports resolve to committed files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check that every test file's imports exist
        run: |
          node .github/scripts/check-test-imports.mjs \
            tests \
            netlify/functions/lib \
            scripts

  # ── 2. Self-test: verify the guard catches missing imports ─────────────────
  guard-self-test:
    name: Verify the guard catches missing imports (negative tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run guard negative tests
        run: |
          SCRIPT=".github/scripts/check-test-imports.mjs"
          BASE=$(mktemp -d)
          PASSED=0
          FAILED=0

          pass() { echo "OK:   $1"; PASSED=$((PASSED+1)); }
          fail() { echo "FAIL: $1"; FAILED=$((FAILED+1)); }

          # Runs guard against $1; expects exit code $2; labels as $3
          run_guard() {
            local dir="$1" want="$2" label="$3"
            local got=0
            node "$SCRIPT" "$dir" >/dev/null 2>&1 || got=$?
            if [ "$got" -eq "$want" ]; then pass "$label"; else fail "$label (want $want, got $got)"; fi
          }

          # ── 1. green: named import → existing file ─────────────────────────
          D="$BASE/green"; mkdir -p "$D"
          echo "export const x = 1;" > "$D/real.ts"
          printf "import test from 'node:test';\nimport { x } from './real.ts';\n" > "$D/green.test.ts"
          run_guard "$D" 0 "named import → existing file exits 0"

          # ── 2. red: named import → missing file ───────────────────────────
          D="$BASE/missing-named"; mkdir -p "$D"
          printf "import test from 'node:test';\nimport { fn } from './gone.ts';\n" > "$D/missing.test.ts"
          run_guard "$D" 1 "named import → missing file exits 1"

          # ── 3. red: side-effect import → missing file ──────────────────────
          D="$BASE/side-effect"; mkdir -p "$D"
          printf "import test from 'node:test';\nimport './missing-polyfill';\n" > "$D/se.test.ts"
          run_guard "$D" 1 "side-effect import → missing file exits 1"

          # ── 4. red: dynamic import → missing file ──────────────────────────
          D="$BASE/dynamic"; mkdir -p "$D"
          printf "import test from 'node:test';\nconst m = await import('./missing-dynamic.js');\n" > "$D/dyn.test.ts"
          run_guard "$D" 1 "dynamic import → missing file exits 1"

          # ── 5. green: dynamic import → existing file ───────────────────────
          D="$BASE/dynamic-ok"; mkdir -p "$D"
          echo "export const dyn = 1;" > "$D/present.js"
          printf "import test from 'node:test';\nconst m = await import('./present.js');\n" > "$D/dynok.test.ts"
          run_guard "$D" 0 "dynamic import → existing file exits 0"

          # ── 6. red: re-export → missing file ──────────────────────────────
          D="$BASE/reexport"; mkdir -p "$D"
          printf "import test from 'node:test';\nexport { fn } from './gone-source.ts';\n" > "$D/reexp.test.ts"
          run_guard "$D" 1 "re-export → missing file exits 1"

          # ── 7. red: bare directory, no index ──────────────────────────────
          D="$BASE/dir-no-index"; mkdir -p "$D/empty-dir"
          printf "import test from 'node:test';\nimport { u } from './empty-dir';\n" > "$D/t.test.ts"
          run_guard "$D" 1 "bare directory with no index exits 1"

          # ── 8. green: bare directory WITH index.ts ─────────────────────────
          D="$BASE/dir-with-index"; mkdir -p "$D/util"
          echo "export const h = () => {};" > "$D/util/index.ts"
          printf "import test from 'node:test';\nimport { h } from './util';\n" > "$D/t.test.ts"
          run_guard "$D" 0 "bare directory WITH index.ts exits 0"

          # ── 9. red: empty test directory ──────────────────────────────────
          D="$BASE/empty"; mkdir -p "$D"
          run_guard "$D" 1 "empty test directory exits 1"

          # ── 10. red: nested test file with missing import ─────────────────
          D="$BASE/nested"; mkdir -p "$D/sub"
          printf "import test from 'node:test';\nimport { x } from './missing-nested.ts';\n" > "$D/sub/nested.test.ts"
          run_guard "$D" 1 "nested test file → missing import exits 1"

          # ── 11. green: nested test file with existing import ──────────────
          D="$BASE/nested-ok"; mkdir -p "$D/sub"
          echo "export const n = 1;" > "$D/sub/real.ts"
          printf "import test from 'node:test';\nimport { n } from './real.ts';\n" > "$D/sub/ok.test.ts"
          run_guard "$D" 0 "nested test file → existing import exits 0"

          # ── 12. red: nested test file, cross-dir '../' import → missing ────
          D="$BASE/cross-dir-missing"; mkdir -p "$D/functions" "$D/shared"
          printf "import test from 'node:test';\nimport { x } from '../shared/util';\n" > "$D/functions/fn.test.ts"
          # shared/util.ts intentionally absent
          run_guard "$D" 1 "cross-dir '../' import → missing sibling file exits 1"

          # ── 13. green: nested test file, cross-dir '../' import → exists ───
          D="$BASE/cross-dir-ok"; mkdir -p "$D/functions" "$D/shared"
          echo "export const x = 1;" > "$D/shared/util.ts"
          printf "import test from 'node:test';\nimport { x } from '../shared/util';\n" > "$D/functions/fn.test.ts"
          run_guard "$D" 0 "cross-dir '../' import → existing sibling file exits 0"

          echo ""
          echo "Guard self-test results: $PASSED passed, $FAILED failed"
          if [ "$FAILED" -gt 0 ]; then
            echo "❌ Guard self-test FAILED."
            exit 1
          fi
          echo "✅ All guard self-tests passed."
