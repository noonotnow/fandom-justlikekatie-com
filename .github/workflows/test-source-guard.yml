name: Test–Source Guard

# Catches the "split-brain" failure mode: a test file is pushed while its
# implementation stays local.  Every relative import in every *.test.ts /
# *.test.js file must resolve to a file that exists in the repository.
# If any import target is missing, this job fails with the list of gaps,
# giving a clear signal before the whole test suite turns red.
#
# Covered import forms:
#   import './side-effect'           (side-effect / no `from`)
#   import Foo from './module'       (named static import)
#   export { x } from './re-export'  (re-export)
#   import('./dynamic')              (dynamic import)
#
# A bare directory path is rejected unless it contains a recognised index file.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── 1. Real guard: checks the actual tests/ directory ─────────────────────
  check-test-imports:
    name: Verify test imports resolve to committed files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check that every test file's imports exist
        run: node .github/scripts/check-test-imports.mjs tests

  # ── 2. Self-test: verify the guard itself catches missing imports ──────────
  guard-self-test:
    name: Verify the guard catches missing imports (negative tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run guard negative tests
        run: |
          set -euo pipefail

          SCRIPT=".github/scripts/check-test-imports.mjs"
          TMPDIR_BASE=$(mktemp -d)
          PASSED=0
          FAILED=0

          fail() { echo "FAIL: $1"; FAILED=$((FAILED+1)); }
          pass() { echo "OK:   $1"; PASSED=$((PASSED+1)); }

          # Helper: run the guard against a temp dir; expect exit code $2
          run_guard() {
            local dir="$1" expected_exit="$2" label="$3"
            local actual=0
            node "$SCRIPT" "$dir" > /dev/null 2>&1 || actual=$?
            if [ "$actual" -eq "$expected_exit" ]; then
              pass "$label"
            else
              fail "$label — expected exit $expected_exit, got $actual"
            fi
          }

          # ── Case 1: green path — import that exists ────────────────────────
          D="$TMPDIR_BASE/case-green"
          mkdir -p "$D"
          echo "export const x = 1;" > "$D/real-source.ts"
          cat > "$D/green.test.ts" <<'EOF'
          import test from 'node:test';
          import { x } from './real-source.ts';
          EOF
          run_guard "$D" 0 "named import → existing file exits 0"

          # ── Case 2: missing named import ───────────────────────────────────
          D="$TMPDIR_BASE/case-missing-named"
          mkdir -p "$D"
          cat > "$D/missing.test.ts" <<'EOF'
          import test from 'node:test';
          import { fn } from './does-not-exist.ts';
          EOF
          run_guard "$D" 1 "named import → missing file exits 1"

          # ── Case 3: missing side-effect import ─────────────────────────────
          D="$TMPDIR_BASE/case-missing-side-effect"
          mkdir -p "$D"
          cat > "$D/side-effect.test.ts" <<'EOF'
          import test from 'node:test';
          import './missing-polyfill';
          EOF
          run_guard "$D" 1 "side-effect import → missing file exits 1"

          # ── Case 4: directory exists but has no index ──────────────────────
          D="$TMPDIR_BASE/case-dir-no-index"
          mkdir -p "$D/empty-dir"
          cat > "$D/dir-import.test.ts" <<'EOF'
          import test from 'node:test';
          import { util } from './empty-dir';
          EOF
          run_guard "$D" 1 "bare directory with no index exits 1"

          # ── Case 5: directory WITH index is accepted ───────────────────────
          D="$TMPDIR_BASE/case-dir-with-index"
          mkdir -p "$D/util-dir"
          echo "export const helper = () => {};" > "$D/util-dir/index.ts"
          cat > "$D/dir-with-index.test.ts" <<'EOF'
          import test from 'node:test';
          import { helper } from './util-dir';
          EOF
          run_guard "$D" 0 "bare directory WITH index.ts exits 0"

          # ── Case 6: no test files → exits 1 ───────────────────────────────
          D="$TMPDIR_BASE/case-empty-dir"
          mkdir -p "$D"
          run_guard "$D" 1 "empty test directory exits 1"

          # ── Summary ───────────────────────────────────────────────────────
          echo ""
          echo "Guard self-test results: $PASSED passed, $FAILED failed"
          if [ "$FAILED" -gt 0 ]; then
            echo "❌ Guard self-test FAILED — the guard itself has gaps."
            exit 1
          fi
          echo "✅ All guard self-tests passed."
