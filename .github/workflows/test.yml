name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  deployment_status:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      verification_only:
        description: "Exercise the review-PR path even when the release pin is current"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  operator-alert-configuration:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    name: Verify operator alert delivery configuration
    environment: operator-sender-verification
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check Resend credentials and verified sender without emailing
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_DOMAIN_READ_API_KEY: ${{ secrets.RESEND_DOMAIN_READ_API_KEY }}
          FANDOM_AUTH_FROM_EMAIL: ${{ secrets.FANDOM_AUTH_FROM_EMAIL }}
          FANDOM_ADMIN_EMAILS: ${{ secrets.FANDOM_ADMIN_EMAILS }}
        run: npm run check:launchpad-preview -- --check-alert-configuration

  production-launchpad-preview:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        (github.event.deployment.environment == 'production' || github.event.deployment.environment == 'Production')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Confirm deployed launchpad preview image is reachable
        run: npm run check:launchpad-preview

      - name: Notify operators about failed launchpad preview
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FANDOM_AUTH_FROM_EMAIL: ${{ secrets.FANDOM_AUTH_FROM_EMAIL }}
          FANDOM_ADMIN_EMAILS: ${{ secrets.FANDOM_ADMIN_EMAILS }}
        run: npm run check:launchpad-preview -- --notify-failure

  production-public-records:
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'production' || github.event.deployment.environment == 'Production')
    name: Verify sitemap-linked public records
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check live actor, edition, and released-pack records
        run: npm run check:public-records

  production-archive-records:
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'production' || github.event.deployment.environment == 'Production')
    name: Verify all Archive-advertised records
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check every Archive page and advertised record after propagation
        run: |
          for attempt in 1 2 3; do
            if npm run check:archive-records; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Archive check attempt $attempt failed; retrying after 20 seconds."
              sleep 20
            fi
          done
          echo "::error::Production Archive record verification failed after 3 attempts."
          exit 1

      - name: Notify operators about failed Archive record verification
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FANDOM_AUTH_FROM_EMAIL: ${{ secrets.FANDOM_AUTH_FROM_EMAIL }}
          FANDOM_ADMIN_EMAILS: ${{ secrets.FANDOM_ADMIN_EMAILS }}
        run: node scripts/notify-archive-records-failure.js

  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Verify pnpm version matches package.json
        run: |
          expected="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          actual="$(pnpm --version)"
          test "$actual" = "$expected"

      - name: Check lockfiles are synchronized
        run: npm run check:lockfiles

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check:types

      - name: Validate application migrations
        run: npm run check:migrations

      - name: Verify packaged scheduled functions
        run: npm run check:scheduled-functions-package

      - name: Install Playwright browsers
        run: npm run browser:install:ci

      - name: Check test imports resolve to committed files
        run: |
          node .github/scripts/check-test-imports.mjs \
            tests \
            netlify/functions/lib \
            scripts

      - name: Run app tests
        run: npm run test:app

      - name: Run function tests
        run: npm run test:functions

      - name: Run script tests
        run: npm run test:scripts

      - name: Run browser tests
        run: npm run test:browser

  migration-retry:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Migration retry (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply every migration twice
        env:
          MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: node --test --test-name-pattern="applies every committed migration twice" scripts/check-migrations.test.js

  migration-next-major:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Migration candidate (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ["18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply every migration twice
        env:
          MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: node --test --test-name-pattern="applies every committed migration twice" scripts/check-migrations.test.js

      - name: Notify operators about failed PostgreSQL candidate migration
        if: failure()
        env:
          POSTGRES_CANDIDATE: ${{ matrix.postgres }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FANDOM_AUTH_FROM_EMAIL: ${{ secrets.FANDOM_AUTH_FROM_EMAIL }}
          FANDOM_ADMIN_EMAILS: ${{ secrets.FANDOM_ADMIN_EMAILS }}
        run: node scripts/notify-migration-failure.js

  shared-stripe-audit-consistency:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Shared Stripe audit consistency check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run shared Stripe audit consistency check
        env:
          SUBSCRIPTION_PRODUCT_AUDIT_BLOBS_SITE_ID: ${{ secrets.SUBSCRIPTION_PRODUCT_AUDIT_BLOBS_SITE_ID }}
          SUBSCRIPTION_PRODUCT_AUDIT_BLOBS_TOKEN: ${{ secrets.SUBSCRIPTION_PRODUCT_AUDIT_BLOBS_TOKEN }}
        run: |
          if [ -z "$SUBSCRIPTION_PRODUCT_AUDIT_BLOBS_SITE_ID" ] || [ -z "$SUBSCRIPTION_PRODUCT_AUDIT_BLOBS_TOKEN" ]; then
            echo "::error::Shared Stripe audit consistency check requires its protected Blob site ID and token."
            exit 1
          fi
          node --test scripts/audit-subscription-products.blob-integration.test.js

      - name: Notify operators about failed shared Stripe audit consistency check
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FANDOM_AUTH_FROM_EMAIL: ${{ secrets.FANDOM_AUTH_FROM_EMAIL }}
          FANDOM_ADMIN_EMAILS: ${{ secrets.FANDOM_ADMIN_EMAILS }}
        run: node scripts/notify-shared-stripe-audit-failure.js

  netlify-package-compatibility:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: netlify-package-compatibility-proposal
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: npm ci

      - name: Resolve Netlify CLI versions
        id: netlify_cli
        run: |
          pinned="$(node scripts/update-netlify-cli-pin.js --current)"
          candidate="$(npm view netlify-cli version)"
          node scripts/update-netlify-cli-pin.js --check-candidate "$candidate"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "upgrade=$(node scripts/update-netlify-cli-pin.js --is-newer "$candidate")" >> "$GITHUB_OUTPUT"

      - name: Verify candidate Netlify packaging contract
        env:
          NETLIFY_CLI_VERSION: ${{ steps.netlify_cli.outputs.candidate }}
        run: npm run check:scheduled-functions-package:compat

      - name: Prepare reviewed pin upgrade
        if: steps.netlify_cli.outputs.upgrade == 'true'
        run: node scripts/update-netlify-cli-pin.js "${{ steps.netlify_cli.outputs.candidate }}"

      - name: Prepare verification-only proposal receipt
        if: inputs.verification_only
        run: |
          cat > .github/netlify-cli-proposal-verification.md <<EOF
          # Netlify CLI proposal verification

          This verification-only proposal exercised the review pull-request path with tested candidate \`netlify-cli@${{ steps.netlify_cli.outputs.candidate }}\`.
          EOF

      - name: Create or refresh Netlify CLI upgrade proposal
        if: steps.netlify_cli.outputs.upgrade == 'true' || inputs.verification_only
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.REPO_ADMIN_PAT }}
          add-paths: |
            package.json
            .github/netlify-cli-proposal-verification.md
          base: main
          branch: automation/netlify-cli-pin
          commit-message: "${{ inputs.verification_only && 'test: verify Netlify CLI proposal for' || 'chore: update Netlify CLI release pin to' }} ${{ steps.netlify_cli.outputs.candidate }}"
          title: "${{ inputs.verification_only && '[Verification only] ' || '' }}[Netlify CLI] Upgrade release pin to ${{ steps.netlify_cli.outputs.candidate }}"
          body: |
            ## Reviewed Netlify CLI upgrade candidate

            ${{ inputs.verification_only && '> **Verification only:** This temporary proposal exercises the review pull-request path and must not be merged.' || '' }}

            The scheduled-functions compatibility workflow tested:

            - Release pin: `${{ steps.netlify_cli.outputs.pinned }}`
            - Upgrade candidate: `${{ steps.netlify_cli.outputs.candidate }}`

            `netlify-cli@${{ steps.netlify_cli.outputs.candidate }}` generated the scheduled-functions manifest successfully, and `scripts/check-scheduled-functions-package.js` confirmed that every required maintenance job retained its expected cadence.

            This pull request only proposes the deterministic release-pin change. It does not merge automatically; normal review and required checks still apply.
          delete-branch: true

      - name: Summarize the pinning decision
        if: always()
        run: |
          echo "The required release check remains pinned to netlify-cli@${{ steps.netlify_cli.outputs.pinned }} on the checked-out branch."
          echo "Compatibility candidate: netlify-cli@${{ steps.netlify_cli.outputs.candidate }}."
          echo "A newer passing candidate is proposed through a pull request; it is never merged automatically."
