name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          npm ci 2>&1 | tee /tmp/npm-ci.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "::error::npm ci failed (exit $STATUS). Output:"
            tail -30 /tmp/npm-ci.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $STATUS
          fi

      - name: Run app tests
        run: npm run test:app

      - name: Run function tests
        run: npm run test:functions
