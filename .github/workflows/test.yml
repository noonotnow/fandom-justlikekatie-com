name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Check lockfiles are synchronized
        run: npm run check:lockfiles

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Check test imports resolve to committed files
        run: |
          node .github/scripts/check-test-imports.mjs \
            tests \
            netlify/functions/lib \
            scripts

      - name: Run app tests
        run: npm run test:app

      - name: Run function tests
        run: npm run test:functions

      - name: Run browser tests
        run: npm run test:browser
