    <link rel="stylesheet" href="/fonts/cjk-display-fallback.css" />
    <script>
      // Capability-bearing veteran links must be sanitized before any analytics
      // bootstrap can inspect the browser URL.
      (function() {
        var veteranPath = '/vibe-atlas/veteran-journal';
        var normalizedPath = window.location.pathname.replace(/\/+$/, '') || '/';
        var params = new URLSearchParams(window.location.search);
        if (normalizedPath !== veteranPath || !params.has('journal')) return;

        var journalId = (params.get('journal') || '').trim();
        var currentState = window.history.state;
        var nextState = currentState && typeof currentState === 'object'
          ? Object.assign({}, currentState)
          : {};
        if (journalId) nextState.veteranJournalId = journalId;
        window.history.replaceState(nextState, '', veteranPath);
      })();
    </script>
    <!-- Google tracking is restricted to the canonical production host and starts
         only after the server-verified session classification resolves to a
         non-operator visitor (see public/audience-gate.js). -->
    <script>
      var analyticsPath = window.location.pathname.replace(/\/+$/, '') || '/';
      // Never forward the URL fragment: /auth/verify carries a sign-in token there.
      window.__initialAnalyticsLocation = analyticsPath === '/vibe-atlas/veteran-journal'
        ? window.location.origin + '/vibe-atlas/veteran-journal'
        : analyticsPath === '/vibe-atlas' && new URLSearchParams(window.location.search).get('view') === 'released'
          ? window.location.origin + '/vibe-atlas?view=released'
        : window.location.origin + window.location.pathname + window.location.search;
    </script>
    <script src="/audience-gate.js"></script>
